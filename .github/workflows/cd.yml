name: AetherAI CD

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  aws-deploy:
    name: AWS Deployment
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::329539067702:role/AetherAI-GitHubActions-Role
          aws-region: ap-south-1

      - name: Verify AWS connection
        run: aws sts get-caller-identity
